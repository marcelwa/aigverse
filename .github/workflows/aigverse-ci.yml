name: 🐍 • CI

on:
  merge_group:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  changes:
    name: 🔍 Changes
    runs-on: ubuntu-latest
    permissions:
      contents: read # required to check out the repository and diff against the base ref
    outputs:
      cpp: ${{ steps.filter.outputs.cpp || 'true' }}
      python: ${{ steps.filter.outputs.python || 'true' }}
      benchmarks: ${{ steps.filter.outputs.benchmarks || 'true' }}
      workflows: ${{ steps.filter.outputs.workflows || 'true' }}
    steps:
      - name: Clone Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Only `pull_request` gives us a stable base ref to diff against. On
      # push/merge_group/workflow_dispatch every output defaults to `true` above,
      # so the full pipeline always runs there.
      - if: github.event_name == 'pull_request'
        name: Determine which parts of the pipeline are affected
        id: filter
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        with:
          filters: |
            cpp:
              - "**/*.hpp"
              - "**/*.cpp"
              - "**/*.cmake"
              - "**/CMakeLists.txt"
              - "libs/**"
            python:
              - "src/aigverse/**"
              - "test/**"
              - "**/*.py"
              - "**/*.pyi"
              - "pyproject.toml"
              - "uv.lock"
            benchmarks:
              - "python/aigverse/benchmarks/**"
              - "test/benchmarks/**"
              - "test/conftest.py"
              - "noxfile.py"
              - "pyproject.toml"
            workflows:
              - ".github/workflows/**"

  lint-python:
    name: 🚨 Lint
    needs: changes
    if: fromJSON(needs.changes.outputs.cpp) || fromJSON(needs.changes.outputs.python) || fromJSON(needs.changes.outputs.workflows)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # required to check out the repository
    steps:
      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          save-cache: ${{ github.ref == 'refs/heads/main' }}

      - name: Run ty
        run: uvx prek run -a ty

      - name: Check if stub files are up to date
        run: |
          uvx nox -s stubs
          if [[ -n "$(git status --porcelain python)" ]]; then
            echo "Stub files are not up to date. Please run 'nox -s stubs' and commit the changes."
            git --no-pager diff python
            exit 1
          fi

      - name: Run check-sdist
        run: uvx check-sdist --inject-junk

  lint-cpp:
    name: 🚨 Clang-Tidy
    needs: changes
    if: fromJSON(needs.changes.outputs.cpp) || fromJSON(needs.changes.outputs.workflows)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # required to post/update the clang-tidy thread comment on the PR
    steps:
      - name: Clone Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake libpython3-dev

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          save-cache: ${{ github.ref == 'refs/heads/main' }}

      - name: Install build dependencies with uv
        run: uv sync --only-group build --no-install-project

      - name: Generate compilation database
        # kept absolute (not simplified to a relative path) because CMake caches this value and
        # nanobind's build-time custom commands may invoke it from other working directories
        env:
          WORKSPACE: ${{ github.workspace }}
        run: >
          cmake -B build -S .
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          -DPython_EXECUTABLE="$WORKSPACE/.venv/bin/python"

      - name: Run clang-tidy
        id: linter
        uses: cpp-linter/cpp-linter-action@8e85cd02c8c3fe3ae527c94b5683fe2366b144ed # v2.20.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          style: ""
          tidy-checks: ""
          database: "build"
          step-summary: true
          thread-comments: ${{ ((github.event_name == 'pull_request' && !github.event.pull_request.head.repo.fork) && 'update') || 'false' }}
          ignore: "build|libs/*|docs/*"
          extra-args: "-I${{ github.workspace }}/include -I${{ github.workspace }}/src/aigverse"
          version: "21"
          files-changed-only: true

      - if: steps.linter.outputs.checks-failed > 0
        run: exit 1

  zizmor:
    name: 🌈 Zizmor
    needs: changes
    if: fromJSON(needs.changes.outputs.workflows)
    runs-on: ubuntu-latest
    permissions:
      security-events: write # required to upload results to the code scanning API
    steps:
      - name: Clone Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor 🌈
        uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2
        with:
          persona: pedantic
          # fork PRs get a read-only GITHUB_TOKEN and cannot upload SARIF to code scanning
          advanced-security: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork) }}

  benchmark-tests:
    name: 📊 ${{ matrix.runs-on }}
    needs: changes
    if: fromJSON(needs.changes.outputs.benchmarks) || fromJSON(needs.changes.outputs.workflows)
    runs-on: ${{ matrix.runs-on }}
    permissions:
      contents: read # required to check out the repository
    strategy:
      fail-fast: false
      matrix:
        runs-on: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, windows-2025]
    steps:
      - name: Clone Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@5ebbd400eff9e74630f759d94ddd7b6c26299639 # v1.2
        with:
          key: "${{ matrix.runs-on }}-aigverse"
          save: ${{ github.ref == 'refs/heads/main' }}
          max-size: 10G

      - if: runner.os == 'Linux'
        name: Setup mold
        uses: rui314/setup-mold@9c9c13bf4c3f1adef0cc596abc155580bcb04444 # v1

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          save-cache: ${{ github.ref == 'refs/heads/main' }}

      # `nox -s tests` covers every supported Python version. The loader is pure
      # Python, and the cache path it builds is the sort of thing that differs
      # between platforms, so both axes are worth the matrix.
      #
      # Deliberately no pre-seeded benchmark cache: exercising the real download
      # path is the entire point of this job.
      - name: 📊 Test the benchmark loader
        run: uvx nox -s tests --verbose -- -m network

  build-sdist:
    name: 📦 CI
    needs: changes
    if: fromJSON(needs.changes.outputs.cpp) || fromJSON(needs.changes.outputs.python) || fromJSON(needs.changes.outputs.workflows)
    permissions:
      contents: read
    uses: ./.github/workflows/build-sdist.yml

  build-wheels:
    name: 🛞 CI
    needs: changes
    if: fromJSON(needs.changes.outputs.cpp) || fromJSON(needs.changes.outputs.python) || fromJSON(needs.changes.outputs.workflows)
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        runs-on: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, windows-2025]
    uses: ./.github/workflows/build-wheels.yml
    with:
      runs-on: ${{ matrix.runs-on }}

  required-checks-pass:
    name: 🚦 Required checks pass
    if: always()
    needs:
      - changes
      - lint-python
      - lint-cpp
      - zizmor
      - benchmark-tests
      - build-sdist
      - build-wheels
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@05ac9388f0aebcb5727afa17fcccfecd6f8ec5fe # v1.2.2
        with:
          allowed-skips: >-
            ${{ !(fromJSON(needs.changes.outputs.cpp) || fromJSON(needs.changes.outputs.python) || fromJSON(needs.changes.outputs.workflows)) && 'lint-python,build-sdist,build-wheels,' || '' }}
            ${{ !(fromJSON(needs.changes.outputs.cpp) || fromJSON(needs.changes.outputs.workflows)) && 'lint-cpp,' || '' }}
            ${{ !fromJSON(needs.changes.outputs.workflows) && 'zizmor,' || '' }}
            ${{ !(fromJSON(needs.changes.outputs.benchmarks) || fromJSON(needs.changes.outputs.workflows)) && 'benchmark-tests,' || '' }}
          jobs: ${{ toJSON(needs) }}
