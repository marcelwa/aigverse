# this file is heavily based on https://github.com/cda-tum/mqt-workflows/blob/main/.github/workflows/reusable-python-packaging.yml

name: 🐍 • Packaging

on:
  release:
    types: [published]
  merge_group:
  push:
    branches: ["main"]
    paths:
      - "src/aigverse/**"
      - "test/**"
      - "**/*.py"
      - "**/*.pyi"
      - "**/*.hpp"
      - "**/*.cpp"
      - "**/*.cmake"
      - "**/CMakeLists.txt"
      - "libs/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/aigverse-pypi-deployment.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "src/aigverse/**"
      - "test/**"
      - "**/*.py"
      - "**/*.pyi"
      - "**/*.hpp"
      - "**/*.cpp"
      - "**/*.cmake"
      - "**/CMakeLists.txt"
      - "libs/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/aigverse-pypi-deployment.yml"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build_sdist:
    name: 📦 Build Source Distribution
    runs-on: ubuntu-latest
    permissions:
      contents: read # required to check out the repository
    steps:
      - name: Clone Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false

      - name: Build sdist
        run: uv build --sdist

      - name: Check metadata
        run: uvx twine check dist/*

      - name: Upload sdist as an artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cibw-sdist
          path: dist/*.tar.gz
          overwrite: true

  build_wheels:
    name: 🛞 Wheels for ${{ matrix.runs-on }}
    runs-on: ${{ matrix.runs-on }}
    permissions:
      contents: read # required to check out the repository

    strategy:
      fail-fast: false
      matrix:
        runs-on: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, windows-2025]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up MSVC development environment (Windows only)
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0

      # Linux only, and that is not an oversight. cibuildwheel builds each wheel
      # under a directory it names randomly per run -- `cibw-run-43zqqz1p`, then
      # `cibw-run-ihw907m4` -- and on the native runners the build interpreter
      # lives inside it, so its include path lands in every compile command and
      # no command ever repeats. Measured with a restored 276 MB cache present:
      # windows 145 requests / 0 hits, macOS 145 calls / 0 hits. Neither ccache
      # nor sccache can normalise that away.
      #
      # The container has no such problem. Everything the Linux build sees is
      # fixed -- /opt/python/cp310-cp310, /project/build/... -- so its commands
      # do repeat and the cache works.
      #
      # The key carries `-wheels` because this workflow and the test matrix used
      # to share `${{matrix.runs-on}}-aigverse` and evict each other, their
      # objects being disjoint.
      - if: runner.os == 'Linux'
        name: Share the sccache directory with the manylinux container
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.sccache"
          echo "CIBW_CONTAINER_ENGINE=docker; create_args: --volume=$GITHUB_WORKSPACE/.sccache:/sccache" >> "$GITHUB_ENV"
          echo "CIBW_ENVIRONMENT_LINUX=SCCACHE_DIR=/sccache SCCACHE_CACHE_SIZE=2G" >> "$GITHUB_ENV"

      - if: runner.os == 'Linux'
        name: Cache sccache objects
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .sccache
          key: sccache-${{ matrix.runs-on }}-aigverse-wheels-${{ github.run_id }}
          restore-keys: sccache-${{ matrix.runs-on }}-aigverse-wheels-

      - if: runner.os == 'Linux'
        name: Setup mold
        uses: rui314/setup-mold@9c9c13bf4c3f1adef0cc596abc155580bcb04444 # v1

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false

      - name: Build wheels
        uses: pypa/cibuildwheel@298ed2fb2c105540f5ed055e8a6ad78d82dd3a7e # v3.3

      - name: Upload wheel as an artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cibw-wheels-${{ matrix.runs-on }}-${{ strategy.job-index }}
          path: wheelhouse/*.whl
          overwrite: true

  publish_to_pypi:
    needs: [build_sdist, build_wheels]
    runs-on: ubuntu-latest
    name: 🚀 Publish to PyPI
    if: github.event_name == 'release' && github.event.action == 'published'
    permissions:
      attestations: write # required to publish the build provenance attestation
      id-token: write # required by actions/attest-build-provenance and PyPI trusted publishing
    environment:
      name: pypi
      url: https://pypi.org/p/aigverse
    steps:
      - name: Download the previously stored artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: cibw-*
          path: dist
          merge-multiple: true

      - name: Generate artifact attestation for sdist and wheel(s)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/*"

      - name: Deploy to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          skip-existing: true
          verbose: true
          attestations: true
