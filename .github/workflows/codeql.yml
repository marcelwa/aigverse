name: 📝 • CodeQL

on:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}-codeql
  cancel-in-progress: true

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  analyze:
    name: ${{ matrix.emoji }} Analysis
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    permissions:
      actions: read # required by github/codeql-action/init to check the workflow run
      contents: read # required to check out the repository
      security-events: write # required to upload the SARIF results

    strategy:
      fail-fast: false
      matrix:
        # The build mode is what decides how the database is built. C++ is `manual`: the
        # CMake build between `init` and `analyze` below is what CodeQL traces. Python has
        # no build at all, which is `none`.
        language: ["cpp", "python"]
        include:
          - language: cpp
            emoji: 🇨
            build-mode: manual
          - language: python
            emoji: 🐍
            build-mode: none

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # `save: false`, so this consumes the test matrix's cache without writing back a
      # Debug build's objects. The key has to be the runner label the matrix actually
      # uses: spelled `ubuntu-latest-aigverse`, it matched nothing.
      - name: Setup ccache
        if: matrix.language == 'cpp'
        uses: hendrikmuhs/ccache-action@5ebbd400eff9e74630f759d94ddd7b6c26299639 # v1.2
        with:
          key: "ubuntu-26.04-aigverse"
          save: false
          max-size: 10G

      - name: Set up mold as linker
        if: matrix.language == 'cpp'
        uses: rui314/setup-mold@10ca16bf91dc22e05ebdc935cad9c75ea248f621 # v1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          config: |
            queries:
              - uses: security-and-quality

      - name: Install the latest version of uv
        if: matrix.language == 'cpp'
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          save-cache: ${{ github.ref == 'refs/heads/main' }}

      - name: Install build dependencies with uv
        if: matrix.language == 'cpp'
        run: uv sync --only-group build --no-install-project

      - name: Configure CMake
        if: matrix.language == 'cpp'
        # kept absolute (not simplified to a relative path) because CMake caches this value and
        # nanobind's build-time custom commands may invoke it from other working directories
        env:
          WORKSPACE: ${{ github.workspace }}
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Debug
          -DPython_EXECUTABLE="$WORKSPACE/.venv/bin/python"

      - name: Build
        if: matrix.language == 'cpp'
        run: cmake --build build -j4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          upload: False
          output: sarif-results

      - name: Filter SARIF file to exclude library warnings
        uses: advanced-security/filter-sarif@83be8931196fc98d9c506ff10e17763fed75bd1b # main
        with:
          patterns: |
            -**/docs/**
            -**/build/_deps/**
            -**/.venv/**
          input: sarif-results/${{ matrix.language }}.sarif
          output: sarif-results/${{ matrix.language }}.sarif

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: sarif-results/${{ matrix.language }}.sarif
