name: 📊 • Coverage

on:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}-coverage
  cancel-in-progress: true

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  coverage:
    name: 📊 Python ${{ matrix.python }} and C++
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.15t"]
    timeout-minutes: 60
    permissions:
      contents: read # required to check out the repository
      id-token: write # Codecov OIDC for trusted runs; forks use tokenless uploads
    env:
      CC: gcc
      CXX: g++
    steps:
      - name: Clone Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          save-cache: ${{ github.ref == 'refs/heads/main' }}

      - name: Measure coverage
        env:
          COVERAGE_PYTHON: ${{ matrix.python }}
        run: uvx nox -s coverage -p "$COVERAGE_PYTHON" -- --full -m 'not network'

      - name: Save coverage reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-${{ matrix.python }}
          path: |
            build/coverage-${{ matrix.python }}/python.xml
            build/coverage-${{ matrix.python }}/cpp.xml
            build/coverage-${{ matrix.python }}/cpp.json

      - name: Upload Python coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: build/coverage-${{ matrix.python }}/python.xml
          flags: python
          disable_search: true
          fail_ci_if_error: true
          use_oidc: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork) }}

      - name: Upload C++ coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: build/coverage-${{ matrix.python }}/cpp.xml
          flags: cpp
          disable_search: true
          fail_ci_if_error: true
          use_oidc: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork) }}
