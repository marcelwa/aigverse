name: 🚨 • Lint

on:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}-python-linter
  cancel-in-progress: true

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  python-linter:
    name: 🚨 Type check and stubs
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read # required to check out the repository

    # The two checks that `.pre-commit-config.yaml` cannot carry, because both need the
    # compiled extension importable: `ty` resolves the bindings through it, and the stub
    # comparison regenerates the `.pyi` files from it.
    steps:
      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          save-cache: ${{ github.ref == 'refs/heads/main' }}

      - name: Run ty
        run: uvx prek run -a ty

      # The `.pyi` files are generated, never hand-written, so the only thing that can go
      # wrong is a binding change landing without a regeneration. Rebuilding them here and
      # diffing catches exactly that.
      - name: Check if stub files are up to date
        run: |
          uvx nox -s stubs
          if [[ -n "$(git status --porcelain python)" ]]; then
            echo "Stub files are not up to date. Please run 'nox -s stubs' and commit the changes."
            git --no-pager diff python
            exit 1
          fi
