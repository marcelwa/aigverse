name: 📝 • Release Drafter

on:
  push:
    branches: ["main"]

permissions: {}

jobs:
  update_release_draft:
    name: 📝 Draft the next release
    runs-on: ubuntu-latest
    permissions:
      contents: write # required to create and update the release draft

    steps:
      - name: Draft the release notes 📝
        uses: release-drafter/release-drafter@d1a19e60e81a7e650d00a7de9277f87e439117ea # v7.11.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
