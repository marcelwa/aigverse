name: 📝 • Release Drafter

on:
  push:
    branches: ["main"]

permissions: {}

jobs:
  update_release_draft:
    name: 📝 Draft the next release
    runs-on: ubuntu-latest
    permissions:
      contents: write # required to create and update the release draft

    steps:
      - name: Draft the release notes 📝
        uses: release-drafter/release-drafter@978bb0b30c5ee8cdd332ced253758157150d43f0 # v7.10.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
