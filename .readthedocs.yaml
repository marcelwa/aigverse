version: 2

formats:
  - pdf
  - htmlzip

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  apt_packages:
    - graphviz
    - inkscape
  jobs:
    post_checkout:
      # Skip docs build if the commit message contains "skip ci"
      - (git --no-pager log --pretty="tformat:%s -- %b" -1 | grep -viq "skip ci") || exit 183
      # Skip docs build if there are no changes related to docs
      - |
        if [ "$READTHEDOCS_VERSION_TYPE" = "external" ] && git diff --quiet origin/main -- docs/ .readthedocs.yaml pyproject.toml python/aigverse/ src/aigverse/ .github/contributing* .github/support*;
        then
          exit 183;
        fi
      # Unshallow the git clone and fetch tags to get proper version information
      - git fetch --unshallow --tags
      # Ensure submodules are checked out
      - git submodule update --init --recursive
    pre_build:
      # Set up uv
      - asdf plugin add uv
      - asdf install uv latest
      - asdf global uv latest
      # Build the same ABC revision the integration tests use, so that the examples
      # on the ABC documentation page are executed for real rather than shown inert.
      # berkeley-abc is only packaged for Ubuntu 22.04, and Read the Docs offers no
      # build cache, so ABC is compiled here. The post_checkout job above already
      # skips the whole build unless the commit touches the documentation, so this
      # cost is only paid when the docs actually change.
      - ABC_REV=e76768b9d34f9dc67cb6608efecd55db271ff849
        && git clone --filter=blob:none https://github.com/berkeley-abc/abc.git "$HOME/abc"
        && git -C "$HOME/abc" checkout --detach "$ABC_REV"
        && make -C "$HOME/abc" -j"$(nproc)" ABC_USE_NO_READLINE=1
    build:
      html:
        - AIGVERSE_ABC="$HOME/abc/abc" uv run --frozen --no-dev --group docs -m sphinx -T -b html -d docs/_build/doctrees -D language=en docs $READTHEDOCS_OUTPUT/html
      htmlzip:
        - AIGVERSE_ABC="$HOME/abc/abc" uv run --frozen --no-dev --group docs -m sphinx -T -b dirhtml -d docs/_build/doctrees -D language=en docs docs/_build/dirhtml
        - mkdir -p $READTHEDOCS_OUTPUT/htmlzip
        - zip -r $READTHEDOCS_OUTPUT/htmlzip/html.zip docs/_build/dirhtml/*
      pdf:
        - AIGVERSE_ABC="$HOME/abc/abc" uv run --frozen --no-dev --group docs -m sphinx -T -b latex -d docs/_build/doctrees -D language=en docs docs/_build/latex
        - cd docs/_build/latex && latexmk -pdf -f -dvi- -ps- -interaction=nonstopmode -jobname=$READTHEDOCS_PROJECT
        - mkdir -p $READTHEDOCS_OUTPUT/pdf
        - cp docs/_build/latex/$READTHEDOCS_PROJECT.pdf $READTHEDOCS_OUTPUT/pdf/$READTHEDOCS_PROJECT.pdf
