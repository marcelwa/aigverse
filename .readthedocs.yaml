version: 2

formats:
  - pdf
  - htmlzip

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  apt_packages:
    - graphviz
    - inkscape
  jobs:
    post_checkout:
      # Skip docs build if the commit message contains "skip ci"
      - (git --no-pager log --pretty="tformat:%s -- %b" -1 | grep -viq "skip ci") || exit 183
      # Skip docs build if there are no changes related to docs
      - |
        if [ "$READTHEDOCS_VERSION_TYPE" = "external" ] && git diff --quiet origin/main -- docs/ .readthedocs.yaml pyproject.toml python/aigverse/ src/aigverse/ .github/contributing* .github/support*;
        then
          exit 183;
        fi
      # Unshallow the git clone and fetch tags to get proper version information
      - git fetch --unshallow --tags
      # Ensure submodules are checked out
      - git submodule update --init --recursive
    pre_build:
      # Set up uv
      - asdf plugin add uv
      - asdf install uv latest
      - asdf global uv latest
      # The `dot` binary (invoked by graphviz_layout in machine_learning.md) emits a
      # spurious fontconfig warning under Ubuntu 24.04: a sample config snippet
      # (05-reset-dirs-sample.conf) uses a <reset-dirs> element the bundled
      # libfontconfig rejects. myst-nb captures `dot`'s stderr and renders it in the
      # notebook cell output. The build runs as non-root, so we can't edit /etc;
      # instead, mirror the system fontconfig config into /tmp with the offending
      # snippet removed and point FONTCONFIG_FILE at it in the build step below.
      # cp -L dereferences the conf.d symlinks so the copy is self-contained.
      - mkdir -p /tmp/fc && cp /etc/fonts/fonts.conf /tmp/fc/fonts.conf && cp -rL /etc/fonts/conf.d /tmp/fc/conf.d && rm -f /tmp/fc/conf.d/*reset-dirs*
    build:
      html:
        - FONTCONFIG_FILE=/tmp/fc/fonts.conf uv run --frozen --no-dev --group docs -m sphinx -T -b html -d docs/_build/doctrees -D language=en docs $READTHEDOCS_OUTPUT/html
      htmlzip:
        - FONTCONFIG_FILE=/tmp/fc/fonts.conf uv run --frozen --no-dev --group docs -m sphinx -T -b dirhtml -d docs/_build/doctrees -D language=en docs docs/_build/dirhtml
        - mkdir -p $READTHEDOCS_OUTPUT/htmlzip
        - zip -r $READTHEDOCS_OUTPUT/htmlzip/html.zip docs/_build/dirhtml/*
      pdf:
        - FONTCONFIG_FILE=/tmp/fc/fonts.conf uv run --frozen --no-dev --group docs -m sphinx -T -b latex -d docs/_build/doctrees -D language=en docs docs/_build/latex
        - cd docs/_build/latex && latexmk -pdf -f -dvi- -ps- -interaction=nonstopmode -jobname=$READTHEDOCS_PROJECT
        - mkdir -p $READTHEDOCS_OUTPUT/pdf
        - cp docs/_build/latex/$READTHEDOCS_PROJECT.pdf $READTHEDOCS_OUTPUT/pdf/$READTHEDOCS_PROJECT.pdf
