version: 2

# Only HTML is built. Read the Docs caps a build at 15 minutes, and compiling ABC
# so that the ABC page's examples run for real costs a large part of that; the
# additional dirhtml and LaTeX passes needed for the htmlzip and pdf formats do
# not fit alongside it. See the pre_build job below.

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  apt_packages:
    - graphviz
    - inkscape
  jobs:
    post_checkout:
      # Skip docs build if the commit message contains "skip ci"
      - (git --no-pager log --pretty="tformat:%s -- %b" -1 | grep -viq "skip ci") || exit 183
      # Skip docs build if there are no changes related to docs
      - |
        if [ "$READTHEDOCS_VERSION_TYPE" = "external" ] && git diff --quiet origin/main -- docs/ .readthedocs.yaml pyproject.toml python/aigverse/ src/aigverse/ .github/contributing* .github/support*;
        then
          exit 183;
        fi
      # Unshallow the git clone and fetch tags to get proper version information
      - git fetch --unshallow --tags
    pre_build:
      # Set up uv
      - asdf plugin add uv
      - asdf install uv latest
      - asdf global uv latest
      # Build the same ABC revision the integration tests use, so that the examples
      # on the ABC documentation page are executed for real rather than shown inert.
      # berkeley-abc is packaged for Ubuntu 22.04 only and not for the 24.04 image
      # used here, and Read the Docs offers no build cache, so ABC is compiled. The
      # post_checkout job above already skips the whole build unless the commit
      # touches the documentation, so this cost is only paid when the docs change.
      #
      # This is the single most expensive step of the build, so it is trimmed where
      # that is free: ABC defaults to `OPTFLAGS = -g -O`, and the debug information
      # costs roughly 15% of the compile for something no documentation build ever
      # reads. The examples here are small enough that ABC's own speed is irrelevant.
      - ABC_REV=c798fea440d9879a1ae79c3f71936d0bc8103e4d
        && git clone --filter=blob:none https://github.com/berkeley-abc/abc.git "$HOME/abc"
        && git -C "$HOME/abc" checkout --detach "$ABC_REV"
        && make -C "$HOME/abc" -j"$(nproc)" ABC_USE_NO_READLINE=1 OPTFLAGS=-O
    build:
      html:
        - AIGVERSE_ABC="$HOME/abc/abc" uv run --frozen --no-dev --group docs -m sphinx -T -b html -d docs/_build/doctrees -D language=en docs $READTHEDOCS_OUTPUT/html
