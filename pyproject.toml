[build-system]
requires = [
    "scikit-build-core~=1.0.3",
    "vcs-versioning~=2.3.0",
    "nanobind~=3.0.0",
]
build-backend = "scikit_build_core.build"

[project]
name = "aigverse"
description = "A Python library for working with logic networks, synthesis, and optimization."
readme = "README.md"
authors = [
    { name = "Marcel Walter", email = "marcel.walter@tum.de" }
]
keywords = ["aigverse", "logic", "synthesis", "AIG", "EDA", "optimization", "machine learning", "artificial intelligence"]
license = { file = "LICENSE" }

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

requires-python = ">=3.10"

# Split-mode extensions resolve the compiled nanobind backend at import time.
# Never pin or upper-bound it: two projects pinning different versions could not
# be installed together.
dependencies = ["nanobind-backend>=1.0"]

dynamic = ["version"]

[project.optional-dependencies]
adapters = [
    "networkx>=3.0.0",
    # 1.23.0 is the project's own floor; the marked ones raise it to the lowest
    # numpy that still ships wheels for each newer interpreter. Below them
    # `nox -s minimums` falls back to a source build of a numpy that predates the
    # Python it is being built for, which fails.
    "numpy>=1.23.0",
    "numpy>=1.23.2; python_version >= '3.11'",
    "numpy>=1.26.0; python_version >= '3.12'",
    "numpy>=2.1.0; python_version >= '3.13'",
    "numpy>=2.3.2; python_version >= '3.14'",
]

[project.urls]
Source = "https://github.com/marcelwa/aigverse"
Tracker = "https://github.com/marcelwa/aigverse/issues"
Documentation = "https://aigverse.readthedocs.io/en/latest/"

[tool.scikit-build]
# Protect the configuration against future changes in scikit-build-core
minimum-version = "build-system.requires"
# Set the wheel install directory
wheel.install-dir = "aigverse"
# Set required Ninja version
ninja.version = ">=1.10"
# Setuptools-style build caching in a local directory
build-dir = "build/{wheel_tag}/{build_type}"
# Explicitly set the package directory
wheel.packages = ["python/aigverse"]
# One Stable ABI wheel per platform covers every supported CPython
wheel.py-api = "cp310"
# Only build the Python bindings target
build.targets = ["aigverse-networks", "aigverse-algorithms", "aigverse-io", "aigverse-generators", "aigverse-utils"]
# Only install the Python package component
install.components = ["aigverse_Python"]

sdist.include = ["python/aigverse/_version.py"]
sdist.exclude = [
    "**/.github",
    "**/doc",
    "**/docs",
    "**/examples",
    "**/test",
]

[tool.check-sdist]
sdist-only = ["python/aigverse/_version.py"]
git-only = [
    "docs/*",
    "examples/*",
    "test/*",
    ".idea/*",
]
default-ignore = true
mode = "git"
build-backend = "auto"


[[tool.dynamic-metadata]]
provider = "vcs_versioning"


[tool.vcs-versioning]
write_to = "python/aigverse/_version.py"


[tool.pytest]
minversion = "9.0"
strict = true
filterwarnings = ["error"]
markers = [
    "networks: Tests for network data structures",
    "algorithms: Tests for optimization and analysis algorithms",
    "io: Tests for read/write and serialization",
    "generators: Tests for network generators",
    "adapters: Tests for optional adapter integrations",
    "benchmarks: Tests for benchmark loading",
    "network: Tests that require internet access (skipped by default)",
    "tts: Tests for truth table utilities",
    "torch: Tests that require the optional PyTorch dependency (skipped by default)",
    "abc: Tests for the external ABC bridge (skipped when no ABC binary is found)",
]
addopts = [
    "-ra",
    "--numprocesses=auto", # Automatically use all available CPU cores for parallel testing
    "-m", "not torch and not network", # Skip torch- and network-dependent tests by default
]
log_level = "INFO"
testpaths = ["test/"]


[tool.cibuildwheel]
# cp310 builds the one abi3 wheel that serves every supported CPython
build = "cp310-*"
# nanobind-backend publishes no musllinux wheels
skip = ["*-musllinux_*"]
archs = "auto64"
build-frontend = "build[uv]"
test-groups = ["test", "torch"]
test-sources = ["test/"]
# the -m here replaces the one in [tool.pytest] addopts rather than adding to it,
# so the network exclusion has to be repeated or wheel CI would download circuits
test-command = 'pytest test/ -m "(torch or not torch) and not network"'


[tool.cibuildwheel.macos]
environment = { MACOSX_DEPLOYMENT_TARGET = "11.0" }

[tool.cibuildwheel.windows]
before-build = "uv pip install delvewheel>=1.11.2"
repair-wheel-command = "delvewheel repair -w {dest_dir} {wheel} --ignore-existing"

# every abi3 wheel: cp310 everywhere, cp311 on Windows ARM64 (see packaging-wheels.yml)
[[tool.cibuildwheel.overrides]]
select = "cp310-* cp311-win_arm64"
inherit.repair-wheel-command = "append"
repair-wheel-command = "uvx abi3audit --strict --report {wheel}"

# torch publishes no win_arm64 wheel, so the wheel's own test run does without it
[[tool.cibuildwheel.overrides]]
select = "*-win_arm64"
test-groups = ["test"]
test-command = 'pytest test/ -m "not torch and not network"'


[tool.uv]
required-version = ">=0.5.20"
cache-keys = [
    { file = "pyproject.toml" },
    { git = { commit = true, tags = true } },
    { file = "src/**/*.cpp" },
    { file = "python/**/*.py" },
]

[tool.uv.sources]
aigverse = { workspace = true }


[tool.ty.terminal]
# Error if ty emits any warning-level diagnostics.
error-on-warning = true

[tool.ty.src]
exclude = [
    "docs/**",
]


[tool.ruff]
line-length = 120
preview = true
fix = true
unsafe-fixes = true
show-fixes = true
src = ["python", "test", "docs"]
exclude = ["*_version.py"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "C90", # <...> too complex
    "COM812", # Conflicts with formatter
    "CPY001", # Missing copyright notice at top of file
    "FBT003", # Boolean positional value in function call
    "ISC001", # Conflicts with formatter
    "PLR09", # Too many <...>
    "PLR2004", # Magic value used in comparison
    "PLC0415", # Import should be at top of file
    "S101", # Use of assert detected
    "S404", # `subprocess` module is possibly insecure
    "TID252", # Prefer absolute imports over relative imports from parent modules
]
future-annotations = true

isort.required-imports = ["from __future__ import annotations"]

[tool.ruff.lint.per-file-ignores]
"python/aigverse/__init__.py" = ["RUF067"]
# the autouse fixtures reset process-global state -- the ABC binary/rc override
# and the benchmark cache override -- that has to be cleared for every test, not
# only the ones that opt in
"test/**" = ["T20", "ANN", "D", "INP001", "S301", "S403", "pytest-fixture-autouse"]
"docs/**" = ["T20", "ERA001", "INP001"]
# standalone PEP 723 scripts: they print their findings and are not a package
"examples/**" = ["T20", "INP001"]
# the loaders document the exceptions that propagate out of their helpers
"python/aigverse/benchmarks/*.py" = ["DOC502"]
"noxfile.py" = ["T20", "TID251", "ERA001"]
"tools/*.py" = ["S603", "S607"]
# the ABC bridge shells out to a user-configured executable by design, and its
# public functions document the exceptions that propagate out of their helpers
"python/aigverse/abc/*.py" = ["S603", "DOC502"]
# the bridge's tests run the configured ABC themselves, and pin behavior of the
# private helpers the public wrappers are thin over
"test/abc/*.py" = ["S603", "PLC2701"]
"*.pyi" = ["D418", "PYI002", "PYI021", "A003", "N999"]
"*.ipynb" = [
    "D", # pydocstyle
    "E402", # Allow imports to appear anywhere in Jupyter notebooks
    "I002", # Allow missing `from __future__ import annotations` import
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
docstring-code-format = true

[tool.repo-review]
ignore = [
  "GH200", # Renovate instead of Dependabot
  "MY100", # ty instead of mypy
  "PC140", # ty instead of mypy
  "PC160", # Mirrored crate-ci/typos
  "PC170", # No rST files
]

[dependency-groups]
build = [
    "scikit-build-core~=1.0.3",
    "vcs-versioning~=2.3.0",
    "nanobind~=3.0.0",
]
cpp-lint = [
    # `nox -s cpp-lint` configures the project to get a compilation database, so it needs
    # what a configure needs. `cpp-linter` is the package `cpp-linter-action` runs, and
    # `clang-tidy` is the wheel that ships the binary -- pinned together so a local run
    # reports what `.github/workflows/cpp-linter.yml` reports. Bump them with the action.
    { include-group = "build" },
    "clang-tidy==21.1.6",
    "cpp-linter==1.13.0",
]
adapters = [
    "networkx>=3.0.0",
    # 1.23.0 is the project's own floor; the marked ones raise it to the lowest
    # numpy that still ships wheels for each newer interpreter. Below them
    # `nox -s minimums` falls back to a source build of a numpy that predates the
    # Python it is being built for, which fails.
    "numpy>=1.23.0",
    "numpy>=1.23.2; python_version >= '3.11'",
    "numpy>=1.26.0; python_version >= '3.12'",
    "numpy>=2.1.0; python_version >= '3.13'",
    "numpy>=2.3.2; python_version >= '3.14'",
]
torch = [
    # Same story as `numpy` above: `--resolution=lowest-direct` installs these
    # floors literally, and torch ships no wheel for an interpreter that postdates
    # the release. Unlike numpy it then fails outright rather than attempting a
    # source build, since torch publishes no sdist. A wheel on Linux alone is not
    # enough either -- 2.5.0 was the first release to build for 3.13, but only for
    # Linux, so the 3.13 floor is the 2.6.0 that also covers macOS and Windows.
    "torch>=2.2.0",
    "torch>=2.6.0; python_version >= '3.13'",
    "torch>=2.9.0; python_version >= '3.14'",
]
docs = [
    { include-group = "adapters" },
    { include-group = "torch" },
    "furo>=2024.8.6",
    "myst-nb>=1.1.2",
    "sphinx-autoapi>=3.3.3",
    "sphinx-copybutton>=0.5.2",
    "sphinx-design>=0.6.1",
    "sphinx-llm>=0.4.1",
    "sphinxcontrib-svg2pdfconverter>=1.2.3",
    "sphinxext-opengraph>=0.9.1",
    "sphinx>=8.1.3",
    "sphinx>=8.2.3; python_version >= '3.11'",
    # kept in step with the `examples` group so `nox -s minimums` resolves one floor
    "matplotlib>=3.8",
    "pygraphviz>=1.9.0",
    "graphviz>=0.20",
]
examples = [
    # what the standalone PEP 723 scripts under examples/ declare inline. Kept in
    # the dev group as well so `ty` can actually type-check them instead of
    # having to skip the directory. numpy arrives through `adapters` at the same
    # floor the scripts declare.
    { include-group = "adapters" },
    "matplotlib>=3.8",
]
test = [
    { include-group = "adapters" },
    "pytest>=9.0.1",
    "pytest-sugar>=1.1.1",
    "pytest-xdist>=3.8.0",
]
dev = [
    { include-group = "build" },
    { include-group = "adapters" },
    { include-group = "examples" },
    { include-group = "test" },
    "nox>=2025.10.16",
]
